name: FYERS Access Token Helper

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose login to generate an authorisation URL, or exchange to create a fresh access token"
        required: true
        type: choice
        options:
          - login
          - exchange

permissions:
  contents: read

jobs:
  fyers-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate FYERS login URL
        if: inputs.action == 'login'
        env:
          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          FYERS_SECRET_KEY: ${{ secrets.FYERS_SECRET_KEY }}
          FYERS_REDIRECT_URI: ${{ secrets.FYERS_REDIRECT_URI }}
        run: |
          python auth.py login

      - name: Upload FYERS login URL
        if: inputs.action == 'login'
        uses: actions/upload-artifact@v4
        with:
          name: fyers-login-url
          path: fyers_login_url.txt
          retention-days: 1

      - name: Exchange authorisation code for access token
        if: inputs.action == 'exchange'
        env:
          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          FYERS_SECRET_KEY: ${{ secrets.FYERS_SECRET_KEY }}
          FYERS_REDIRECT_URI: ${{ secrets.FYERS_REDIRECT_URI }}
          FYERS_AUTH_CODE: ${{ secrets.FYERS_AUTH_CODE }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$FYERS_AUTH_CODE" ]; then
            echo "::error::Add the one-time FYERS_AUTH_CODE as a repository secret first."
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add GH_SECRETS_TOKEN with permission to update Actions secrets."
            exit 1
          fi
          python auth.py exchange
          TOKEN="$(cat .fyers_access_token)"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" | gh secret set FYERS_ACCESS_TOKEN
          rm -f .fyers_access_token
          echo "Updated repository secret FYERS_ACCESS_TOKEN successfully."
