name: India Day Trader — CI

on:
  pull_request:
    paths:
      - "india_day_trader/**"
      - "crypto_trader/**"
      - "tests/test_crypto_skill_setups.py"
      - "tests/test_india_day_trader.py"
      - "tests/test_backtest_orb.py"
      - "tests/test_research_matrix.py"
      - "tests/test_tracker.py"
      - "tests/test_discord_alerts.py"
      - "tests/test_fyers_auth.py"
      - "tests/test_pdh_pdl_sweep.py"
      - "india_day_trader/discord_alerts.py"
      - "india_day_trader/research_matrix.py"
      - "india_day_trader/backtest_orb.py"
      - "backtest.py"
      - ".github/workflows/india-day-trader-*.yml"
      - "requirements.txt"
permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
