name: Download All NIFTY & SENSEX Historical Data

on:
  workflow_dispatch:
    inputs:
      intraday_start:
        description: "Intraday start date (Standard plan: last 1 year; Prime: older history if entitled)"
        required: true
        default: "2025-11-08"
      daily_start:
        description: "Daily/weekly/monthly start date (Standard plan: from 2021; Prime: older history if entitled)"
        required: true
        default: "2021-01-01"
      end:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2026-11-07"

permissions:
  contents: read

jobs:
  bulk-download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run automated tests
        run: python -m pytest -q
      - name: Download all NIFTY and SENSEX resolutions
        env:
          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
        run: |
          if [ -z "$FYERS_CLIENT_ID" ] || [ -z "$FYERS_ACCESS_TOKEN" ]; then
            echo "::error::Missing FYERS_CLIENT_ID or FYERS_ACCESS_TOKEN repository secret."
            exit 1
          fi
          python bulk_download.py \
            --intraday-start "${{ inputs.intraday_start }}" \
            --daily-start "${{ inputs.daily_start }}" \
            --end "${{ inputs.end }}"
      - name: Upload complete historical dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nifty-sensex-all-historical-data
          path: data/*.csv
          if-no-files-found: warn
          retention-days: 90
